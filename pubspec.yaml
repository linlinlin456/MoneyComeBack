name: book_roi
description: "阅读回本统计：统计已读书籍价值与阅读成本，看阅读器有没有回本。"
publish_to: 'none'
version: 1.2.4+14

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  http: ^1.2.2
  shared_preferences: ^2.3.2
  mobile_scanner: ^5.2.3
  file_picker: ^8.1.4
  share_plus: ^10.0.3
  url_launcher: ^6.3.0
  intl: ^0.19.0
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
